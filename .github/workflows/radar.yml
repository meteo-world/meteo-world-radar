name: Meteo World Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "2-57/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # DEPOT
      # ============================================================

      - name: Recuperer le depot
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow


      # ============================================================
      # RADAR METEO-FRANCE
      # ============================================================

      - name: Telecharger le radar Meteo-France
        env:
          METEOFRANCE_RADAR_API_KEY: ${{ secrets.METEOFRANCE_RADAR_API_KEY }}
        run: |
          python download_radar.py


      # ============================================================
      # OUTILS
      # ============================================================

      - name: Installer les outils
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-14 \
            cmake \
            make \
            libgdal-dev \
            gdal-bin \
            lftp

          echo "=============================="
          echo "VERSIONS"
          echo "=============================="

          g++-14 --version
          cmake --version
          gdalinfo --version


      # ============================================================
      # DEBUFRIZER
      # ============================================================

      - name: Recuperer debufrizer
        run: |
          git clone https://github.com/Meteo-Concept/debufrizer.git


      # ============================================================
      # DIAGNOSTIC DU CODE DEBUFRIZER
      # ============================================================

      - name: Examiner la projection utilisee par debufrizer
        run: |
          echo "===================================================="
          echo "RECHERCHE DES PARAMETRES DE PROJECTION DEBUFRIZER"
          echo "===================================================="

          grep -RniE \
            "stereo|stereographic|projection|proj4|latitude|longitude|parallel|easting|northing|orientation|WGS" \
            debufrizer \
            --exclude-dir=.git \
            || true

          echo ""
          echo "===================================================="
          echo "CODE SECTION3AND4"
          echo "===================================================="

          grep -n -A 30 -B 30 \
            "SetPS" \
            debufrizer/section3and4.cpp \
            || true


      # ============================================================
      # AJOUT DU DIAGNOSTIC METEO WORLD
      # ============================================================

      - name: Ajouter diagnostic Meteo World
        run: |
          python <<'PY'
          from pathlib import Path

          fichier = Path("debufrizer/section3and4.cpp")

          texte = fichier.read_text(encoding="utf-8")

          marqueur = "OGRSpatialReference projection;"

          if marqueur not in texte:
              raise SystemExit(
                  "ERREUR : OGRSpatialReference projection introuvable"
              )

          diagnostic = r'''

              std::println(
                  std::cerr,
                  "=============================================="
              );

              std::println(
                  std::cerr,
                  "METEO WORLD - DIAGNOSTIC GRILLE IMFR27"
              );

              std::println(
                  std::cerr,
                  "origLatitude = {}",
                  grid.origLatitude
              );

              std::println(
                  std::cerr,
                  "origLongitude = {}",
                  grid.origLongitude
              );

              std::println(
                  std::cerr,
                  "Projection debufrizer = SetPS(45, 0, 1, 0, 0)"
              );

              std::println(
                  std::cerr,
                  "=============================================="
              );

          '''

          texte = texte.replace(
              marqueur,
              diagnostic + marqueur,
              1
          )

          fichier.write_text(
              texte,
              encoding="utf-8"
          )

          print("Diagnostic Meteo World ajoute.")
          PY


      # ============================================================
      # COMPILATION
      # ============================================================

      - name: Compiler debufrizer
        run: |
          cd debufrizer

          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14

          make -j2

          echo ""
          echo "=== Fichiers compiles ==="
          ls -lh


      # ============================================================
      # DECODAGE IMFR27
      # ============================================================

      - name: Decoder IMFR27
        run: |
          cp data/latest-imfr27.bufr \
             debufrizer/examples/latest-imfr27.bufr

          cd debufrizer/examples

          echo "======================================="
          echo "DECODAGE COMPLET IMFR27"
          echo "======================================="

          ../build/debufrizer \
            latest-imfr27.bufr \
            radar_ \
            2>&1 | tee ../../debufrizer-imfr27.log

          echo ""
          echo "=== Fichiers produits ==="
          ls -lh


      # ============================================================
      # RESULTAT DU DIAGNOSTIC
      # ============================================================

      - name: Afficher diagnostic projection IMFR27
        run: |
          echo "===================================================="
          echo "RESULTAT DIAGNOSTIC METEO WORLD"
          echo "===================================================="

          grep -A 10 -B 2 \
            "METEO WORLD - DIAGNOSTIC GRILLE IMFR27" \
            debufrizer-imfr27.log \
            || true

          echo ""
          echo "===================================================="
          echo "DESCRIPTEURS GEOGRAPHIQUES IMFR27"
          echo "===================================================="

          grep -iE \
            "029001|029002|029192|030021|030022|005033|006033|005001|006001|005195|006198" \
            debufrizer-imfr27.log \
            || true


      # ============================================================
      # RECUPERATION DU TIFF
      # ============================================================

      - name: Recuperer le TIFF genere
        run: |
          mkdir -p output

          find debufrizer/examples \
            -type f \
            -name "radar_*.tif" \
            -exec cp {} output/ \;

          echo "=== TIFF disponibles ==="
          ls -lh output/

          TIFF=$(find output \
            -type f \
            -name "radar_*.tif" \
            | sort \
            | tail -n 1)

          if [ -z "$TIFF" ]; then
            echo "ERREUR : aucun TIFF radar genere."
            exit 1
          fi

          echo "TIFF selectionne : $TIFF"

          cp "$TIFF" output/radar-latest.tif


      # ============================================================
      # DIAGNOSTIC DU GEOTIFF
      # ============================================================

      - name: Examiner le GeoTIFF produit par debufrizer
        run: |
          echo "===================================================="
          echo "GEOTIFF PRODUIT PAR DEBUFRIZER"
          echo "===================================================="

          gdalinfo \
            -stats \
            output/radar-latest.tif

          echo ""
          echo "===================================================="
          echo "SYSTEME DE COORDONNEES"
          echo "===================================================="

          gdalsrsinfo \
            output/radar-latest.tif \
            || true


      # ============================================================
      # COINS DU RASTER
      # ============================================================

      - name: Tester les coordonnees du GeoTIFF
        run: |
          echo "===================================================="
          echo "COINS DU RASTER"
          echo "===================================================="

          gdalinfo output/radar-latest.tif \
            | grep -A 8 "Corner Coordinates"

          echo ""
          echo "===================================================="
          echo "CENTRE DU RASTER"
          echo "===================================================="

          gdalinfo output/radar-latest.tif \
            | grep "Center" \
            || true


      # ============================================================
      # PNG RADAR
      # ============================================================

      - name: Creer le PNG radar georeference
        run: |
          echo "===================================================="
          echo "CREATION PNG RADAR"
          echo "===================================================="

          python create_radar_png.py

          echo ""
          echo "=== DATA ==="
          ls -lh data/


      # ============================================================
      # VERIFICATION
      # ============================================================

      - name: Verifier le radar final
        run: |
          if [ ! -f data/radar-latest.png ]; then
            echo "ERREUR : radar-latest.png absent."
            exit 1
          fi

          if [ ! -f data/radar-latest.json ]; then
            echo "ERREUR : radar-latest.json absent."
            exit 1
          fi

          echo "===================================================="
          echo "PNG RADAR OK"
          echo "===================================================="

          file data/radar-latest.png

          echo ""
          echo "===================================================="
          echo "JSON / BOUNDS LEAFLET"
          echo "===================================================="

          cat data/radar-latest.json


      # ============================================================
      # ENVOI FTP INFOMANIAK
      # ============================================================

      - name: Envoyer le radar vers Infomaniak
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_SFTP_HOST }}
          FTP_USER: ${{ secrets.INFOMANIAK_SFTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          FTP_PATH: ${{ secrets.INFOMANIAK_SFTP_PATH }}

        run: |
          echo "===================================================="
          echo "ENVOI VERS INFOMANIAK"
          echo "===================================================="

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 20

          cd "$FTP_PATH"

          put data/radar-latest.png -o radar-latest.png
          put data/radar-latest.json -o radar-latest.json

          bye
          EOF

          echo ""
          echo "Radar envoye sur Infomaniak."


      # ============================================================
      # SAUVEGARDE DIAGNOSTIC
      # ============================================================

      - name: Sauvegarder le diagnostic GitHub
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostic
          retention-days: 1

          path: |
            debufrizer-imfr27.log
            output/radar-latest.tif
            output/radar-latest-4326.tif
            data/radar-latest.png
            data/radar-latest.json
            data/latest-imfr27.json
