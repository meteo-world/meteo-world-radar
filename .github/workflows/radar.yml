name: Meteo World Radar

on:
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Telecharger le radar Meteo-France
        env:
          METEOFRANCE_RADAR_API_KEY: ${{ secrets.METEOFRANCE_RADAR_API_KEY }}
        run: |
          python download_radar.py

      - name: Installer les outils de decodage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            cmake \
            make \
            libgdal-dev \
            gdal-bin

          g++-14 --version
          cmake --version
          gdal-config --version

      - name: Recuperer debufrizer
        run: |
          git clone https://github.com/Meteo-Concept/debufrizer.git

      - name: Compiler debufrizer
        run: |
          cd debufrizer
          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14

          make -j2

          echo "=== Fichiers compiles ==="
          ls -lh

      - name: Decoder IMFR27
        run: |
          cp data/latest-imfr27.bufr debufrizer/examples/latest-imfr27.bufr
          cd debufrizer/examples

          echo "=== Decodage IMFR27 ==="
          ../build/debufrizer latest-imfr27.bufr radar_

          echo "=== Fichiers produits ==="
          ls -lh

      - name: Recuperer le TIFF genere
        run: |
          mkdir -p output
          find debufrizer/examples -type f -name "radar_*.tif" -exec cp {} output/ \;

          echo "=== OUTPUT ==="
          ls -lh output/

      - name: Sauvegarder le resultat
        uses: actions/upload-artifact@v4
        with:
          name: radar-decode-test
          path: |
            output/
            data/latest-imfr27.json
