      - name: Envoyer le radar vers Infomaniak
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_SFTP_HOST }}
          FTP_USER: ${{ secrets.INFOMANIAK_SFTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          FTP_PATH: ${{ secrets.INFOMANIAK_SFTP_PATH }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          echo "====================================="
          echo "ENVOI DU RADAR VERS METEO-WORLD"
          echo "====================================="

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          cd "$FTP_PATH"
          put data/radar-latest.png -o radar-latest.png
          put data/radar-latest.json -o radar-latest.json
          bye
          EOF

          echo "Radar envoye sur Infomaniak."
