name: Meteo World Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "2-57/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # DEPOT
      # ============================================================

      - name: Recuperer le depot
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pillow


      # ============================================================
      # TELECHARGEMENT RADAR
      # ============================================================

      - name: Telecharger radar Meteo-France
        env:
          METEOFRANCE_RADAR_API_KEY: ${{ secrets.METEOFRANCE_RADAR_API_KEY }}
        run: |
          python download_radar.py


      # ============================================================
      # OUTILS
      # ============================================================

      - name: Installer outils
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            g++-14 \
            cmake \
            make \
            libgdal-dev \
            gdal-bin \
            lftp

          echo "=============================="
          echo "VERSIONS"
          echo "=============================="

          g++-14 --version
          cmake --version
          gdalinfo --version


      # ============================================================
      # DEBUFRIZER
      # ============================================================

      - name: Recuperer debufrizer
        run: |
          git clone https://github.com/Meteo-Concept/debufrizer.git


      # ============================================================
      # DIAGNOSTIC SOURCE AVANT MODIFICATION
      # ============================================================

      - name: Examiner code grille BUFR
        run: |
          echo "===================================================="
          echo "CODE DEBUFRIZER - GRILLE IMFR27"
          echo "===================================================="

          sed -n '430,555p' debufrizer/section3and4.cpp

          echo ""
          echo "===================================================="
          echo "DESCRIPTEURS METEO-FRANCE"
          echo "===================================================="

          grep -RniE \
            "005195|006198|005001|006001|005033|006033|030021|030022|029001|029192" \
            debufrizer \
            --exclude-dir=.git \
            || true


      # ============================================================
      # AJOUT DIAGNOSTIC DES VALEURS BUFR
      # ============================================================

      - name: Ajouter diagnostic complet IMFR27
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("debufrizer/section3and4.cpp")
          s = p.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Diagnostic des valeurs que debufrizer a deja extraites
          # --------------------------------------------------------

          marker = "OGRSpatialReference projection;"

          if marker not in s:
              raise SystemExit(
                  "ERREUR : emplacement projection introuvable"
              )

          diagnostic = r'''

              std::println(
                  std::cerr,
                  ""
              );

              std::println(
                  std::cerr,
                  "===================================================="
              );

              std::println(
                  std::cerr,
                  "METEO WORLD - VALEURS GRILLE IMFR27"
              );

              std::println(
                  std::cerr,
                  "===================================================="
              );

              std::println(
                  std::cerr,
                  "005001/006001 - coin de reference :"
              );

              std::println(
                  std::cerr,
                  "origLatitude  = {}",
                  grid.origLatitude
              );

              std::println(
                  std::cerr,
                  "origLongitude = {}",
                  grid.origLongitude
              );

              std::println(
                  std::cerr,
                  ""
              );

              std::println(
                  std::cerr,
                  "Projection actuellement imposee par debufrizer :"
              );

              std::println(
                  std::cerr,
                  "SetPS(45, 0, 1, 0, 0)"
              );

              std::println(
                  std::cerr,
                  "===================================================="
              );

          '''

          s = s.replace(
              marker,
              diagnostic + marker,
              1
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("Diagnostic IMFR27 ajoute.")
          PY


      # ============================================================
      # COMPILATION
      # ============================================================

      - name: Compiler debufrizer
        run: |
          cd debufrizer

          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14

          make -j2

          echo ""
          echo "======================================"
          echo "COMPILATION TERMINEE"
          echo "======================================"

          ls -lh


      # ============================================================
      # DECODAGE
      # ============================================================

      - name: Decoder IMFR27
        run: |
          cp \
            data/latest-imfr27.bufr \
            debufrizer/examples/latest-imfr27.bufr

          cd debufrizer/examples

          echo "======================================"
          echo "DECODAGE IMFR27"
          echo "======================================"

          ../build/debufrizer \
            latest-imfr27.bufr \
            radar_ \
            2>&1 | tee ../../debufrizer-imfr27.log

          echo ""
          echo "======================================"
          echo "FICHIERS PRODUITS"
          echo "======================================"

          ls -lh


      # ============================================================
      # DIAGNOSTIC 1
      # ============================================================

      - name: Afficher valeurs grille IMFR27
        run: |
          echo "===================================================="
          echo "VALEURS GRILLE DECODEES"
          echo "===================================================="

          grep -A 20 -B 2 \
            "METEO WORLD - VALEURS GRILLE IMFR27" \
            debufrizer-imfr27.log \
            || true


      # ============================================================
      # DIAGNOSTIC 2
      # ============================================================

      - name: Chercher valeurs projection BUFR
        run: |
          echo "===================================================="
          echo "RECHERCHE PARAMETRES PROJECTION BUFR"
          echo "===================================================="

          echo ""
          echo "DESCRIPTEURS RECHERCHES :"
          echo "005195 = latitude de reference"
          echo "006198 = meridien parallele axe Y"
          echo "005001 = latitude"
          echo "006001 = longitude"
          echo "005033 = taille pixel horizontal 1"
          echo "006033 = taille pixel horizontal 2"
          echo "030021 = pixels par ligne"
          echo "030022 = pixels par colonne"
          echo ""

          grep -iE \
            "005195|006198|005001|006001|005033|006033|030021|030022|referenceLatitude|refLatitude|meridianLongitude|projection" \
            debufrizer-imfr27.log \
            || true


      # ============================================================
      # RECHERCHE DANS LES TABLES LOCALES
      # ============================================================

      - name: Examiner tables locales Meteo-France
        run: |
          echo "===================================================="
          echo "TABLES LOCALES METEO-FRANCE"
          echo "===================================================="

          find debufrizer/examples/bufr/tables \
            -type f \
            -path "*/85/*" \
            -print

          echo ""
          echo "===================================================="
          echo "005195"
          echo "===================================================="

          grep -Rni \
            "005195" \
            debufrizer/examples/bufr/tables \
            || true

          echo ""
          echo "===================================================="
          echo "006198"
          echo "===================================================="

          grep -Rni \
            "006198" \
            debufrizer/examples/bufr/tables \
            || true


      # ============================================================
      # RECUPERATION TIFF
      # ============================================================

      - name: Recuperer TIFF
        run: |
          mkdir -p output

          find debufrizer/examples \
            -type f \
            -name "radar_*.tif" \
            -exec cp {} output/ \;

          echo "======================================"
          echo "TIFF DISPONIBLES"
          echo "======================================"

          ls -lh output/

          TIFF=$(find output \
            -type f \
            -name "radar_*.tif" \
            | sort \
            | tail -n 1)

          if [ -z "$TIFF" ]; then
            echo "ERREUR : aucun TIFF radar."
            exit 1
          fi

          echo ""
          echo "TIFF selectionne : $TIFF"

          cp "$TIFF" output/radar-latest.tif


      # ============================================================
      # GDALINFO
      # ============================================================

      - name: Examiner GeoTIFF
        run: |
          echo "===================================================="
          echo "GDALINFO COMPLET"
          echo "===================================================="

          gdalinfo \
            -stats \
            output/radar-latest.tif

          echo ""
          echo "===================================================="
          echo "PROJECTION"
          echo "===================================================="

          gdalsrsinfo \
            output/radar-latest.tif \
            || true


      # ============================================================
      # COORDONNEES
      # ============================================================

      - name: Afficher coordonnees GeoTIFF
        run: |
          echo "===================================================="
          echo "ORIGINE / PIXELS / COINS"
          echo "===================================================="

          gdalinfo output/radar-latest.tif \
            | grep -E \
            "Size is|Origin|Pixel Size|Upper Left|Lower Left|Upper Right|Lower Right|Center" \
            || true


      # ============================================================
      # CREATION PNG
      # ============================================================

      - name: Creer PNG radar
        run: |
          echo "===================================================="
          echo "CREATION PNG"
          echo "===================================================="

          python create_radar_png.py

          echo ""
          echo "======================================"
          echo "CONTENU DATA"
          echo "======================================"

          ls -lh data/


      # ============================================================
      # VERIFICATION
      # ============================================================

      - name: Verifier radar final
        run: |
          if [ ! -f data/radar-latest.png ]; then
            echo "ERREUR : radar-latest.png absent."
            exit 1
          fi

          if [ ! -f data/radar-latest.json ]; then
            echo "ERREUR : radar-latest.json absent."
            exit 1
          fi

          echo "===================================================="
          echo "PNG"
          echo "===================================================="

          file data/radar-latest.png

          echo ""
          echo "===================================================="
          echo "JSON"
          echo "===================================================="

          cat data/radar-latest.json


      # ============================================================
      # FTP INFOMANIAK
      # ============================================================

      - name: Envoyer radar vers Infomaniak
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_SFTP_HOST }}
          FTP_USER: ${{ secrets.INFOMANIAK_SFTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          FTP_PATH: ${{ secrets.INFOMANIAK_SFTP_PATH }}

        run: |
          echo "===================================================="
          echo "ENVOI INFOMANIAK"
          echo "===================================================="

          lftp \
            -u "$FTP_USER","$FTP_PASSWORD" \
            "$FTP_HOST" <<EOF

          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 20

          cd "$FTP_PATH"

          put \
            data/radar-latest.png \
            -o radar-latest.png

          put \
            data/radar-latest.json \
            -o radar-latest.json

          bye

          EOF

          echo ""
          echo "Radar envoye sur Infomaniak."


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Sauvegarder diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostic
          retention-days: 1

          path: |
            debufrizer-imfr27.log
            output/radar-latest.tif
            data/radar-latest.png
            data/radar-latest.json
            data/latest-imfr27.json
